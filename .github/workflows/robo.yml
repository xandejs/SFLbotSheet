name: SFL Auto-Trader Bot

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch: 

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixando o código
        uses: actions/checkout@v4

      - name: Instalando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalando as bibliotecas
        run: |
          pip install pandas numpy xgboost gspread oauth2client gspread-formatting

      - name: Recriando o JSON secreto
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais_robo.json

      - name: Listar arquivos (Para termos certeza)
        run: ls -R

      - name: Rodando o Cérebro RL 🧠
        # O comando 'find' busca o bot.py e o 'python' o executa, 
        # não importa em qual pasta ele caiu.
        run: |
          FILE_PATH=$(find . -name "bot.py" -not -path "*/.*" | head -n 1)
          python "$FILE_PATH"

name: SFL Auto-Trader Bot

on:
  schedule:
    - cron: '0 * * * *' # Roda de 1 em 1 hora
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Baixando o código
        uses: actions/checkout@v4

      - name: Instalando o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🔥 NOVO PASSO: Configurando o Cache do PIP
      - name: Cache das bibliotecas Python
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Cria uma "chave" baseada no seu arquivo YML. Se você mudar as bibliotecas no futuro, ele atualiza o cache.
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/*.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalando as bibliotecas
        run: |
          pip install pandas numpy xgboost gspread oauth2client gspread-formatting scikit-learn

      - name: Recriando o JSON secreto
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais_robo.json

      - name: Listar arquivos (Para termos certeza)
        run: ls -R

      - name: Rodando o Cérebro RL 🧠
        run: |
          FILE_PATH=$(find . -name "bot.py" -not -path "*/.*" | head -n 1)
          python "$FILE_PATH"

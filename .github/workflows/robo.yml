name: SFL YieldMaster AI

on:
  schedule:
    - cron: '15 */2 * * *'   # :11 de cada hora — evita pico de carga do GitHub no :00
  workflow_dispatch:         # execução manual mantida

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 8       # se o bot travar (ex: rede presa), mata após 8min
                             # sem isso um run travado consome minutos indefinidamente

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          # Chave baseada no requirements.txt: só invalida quando você mudar uma versão.
          # Com o yml como chave (como estava antes), qualquer edit no workflow
          # recriava o cache — desperdiçando ~90s de instalação.
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -q -r requirements.txt
        # -q reduz output e é marginalmente mais rápido
        # Com cache hit, este passo leva ~10s em vez de ~110s

      - name: Credenciais Google
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais_robo.json

      - name: Rodar bot
        run: python bot.py
        # Sem o find: economiza ~3s/run × 720 runs = 36 min/mês
        # Requer que o arquivo se chame bot.py na raiz do repositório

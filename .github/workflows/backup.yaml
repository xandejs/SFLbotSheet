name: SFL Cerebro_RL Weekly Backup

on:
  schedule:
    - cron: '11 23 * * 0'   # Executa todo domingo às 23:11
  workflow_dispatch:         # Permite executar manualmente

jobs:
  run-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    # 🌟 ADICIONE ESTAS DUAS LINHAS AQUI PARA LIBERAR O REPOSITÓRIO:
    permissions:
      contents: write

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Instalar dependências
        run: pip install -q -r requirements.txt

      - name: Credenciais Google
        run: echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credenciais.json

      - name: Executar Script de Backup
        run: python backup_cerebro.py

      - name: Salvar Cópia no Repositório (Persistência Permanente)
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Garante que a pasta existe antes de tentar adicionar
          mkdir -p backups_cerebro
          git add backups_cerebro/
          
          git commit -m "🤖 [Automático] Backup Semanal da Q-Table (Cérebro RL)" || echo "Nenhum dado novo para salvar."
          git push

name: SFL Bot V2

# A V2 substitui a V1 (já desativada). O disparo é feito pelo Apps Script
# (gatilhoBotV2, a cada hora, via workflow_dispatch — logo após o RecLog).
# NÃO reative o `schedule:` abaixo junto com o Apps Script: duplicaria execuções.

on:
  workflow_dispatch:

  # schedule:
  #   - cron: '17 */2 * * *'

# Uma execução por vez. Não cancela a que está rodando (cancelar no meio da
# gravação das abas é pior do que esperar); a seguinte entra na fila.
concurrency:
  group: sfl-bot-v2
  cancel-in-progress: false

jobs:
  rodar-bot-v2:
    runs-on: ubuntu-latest
    # Folga para a 1ª execução com cache frio. Depois de medir o tempo real no
    # relatório do Actions, reduza (ex.: 2x a duração normal).
    timeout-minutes: 10

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache de dependências pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-v2-${{ hashFiles('requirements.txt') }}

      - name: Dia (BRT) para a chave do cache
        id: dia
        run: echo "dia=$(TZ=America/Sao_Paulo date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      # Chave POR DIA: 1 entrada de cache por dia (antes: 1 por execução, ~24/dia).
      # Com a chave do dia já existente o actions/cache não regrava; as execuções
      # seguintes do mesmo dia restauram o cache da primeira e recalculam só as
      # linhas novas (poucas dezenas), o que é barato. O modelo é retreinado 1x
      # por dia de calendário e vai junto neste cache.
      - name: Cache do feature store e do modelo
        uses: actions/cache@v4
        with:
          path: cache_v2/
          key: sfl-v2-feature-cache-${{ steps.dia.outputs.dia }}
          restore-keys: |
            sfl-v2-feature-cache-

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Credenciais Google
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: printf '%s' "$GOOGLE_CREDENTIALS" > credenciais_robo.json

      - name: Executar bot V2
        env:
          TRAVA_URL: ${{ secrets.TRAVA_URL }}
          TRAVA_TOKEN: ${{ secrets.TRAVA_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          # DEBUG_DECISOES: "1"
        run: python bot_v2.py

      - name: Liberar trava do RecLog (segurança)
        if: always()
        env:
          TRAVA_URL: ${{ secrets.TRAVA_URL }}
          TRAVA_TOKEN: ${{ secrets.TRAVA_TOKEN }}
        run: |
          curl -sL --max-time 60 -X POST "$TRAVA_URL" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$TRAVA_TOKEN\",\"acao\":\"liberar\"}" || true
